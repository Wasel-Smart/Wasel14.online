# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "wasel"

[api]
enabled = true
port = 54321
schemas = ["public", "api", "graphql_public", "stripe", "pgmq_public"]
extra_search_path = ["public", "extensions", "realtime", "supabase_migrations", "stripe", "vault", "auth", "storage", "api"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = true
site_url = "https://www.wasel14.online"
additional_redirect_urls = [
  "https://wasel14.online/**",
  "https://www.wasel14.online/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:4173/**",
  "http://127.0.0.1:4173/**",
  "wasel://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = true
enable_signup = true
# Anonymous users receive the `authenticated` role, which would satisfy any RLS
# policy written as `to authenticated`. Keep off unless a guest flow needs it AND
# every policy also checks `(auth.jwt() ->> 'is_anonymous')::boolean is not true`.
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.hook.send_sms]
enabled = false
uri = "https://zexlxabdcsjefptmjhuq.supabase.co/functions/v1/make-server-0b1f4071/auth/hooks/send-sms"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = ""

[auth.sms.twilio_verify]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = ""
[auth.external.google]
# Google and Facebook are enabled on the linked project (verified against
# /auth/v1/settings), and both sign-in methods ship in the app. Credentials stay
# empty here on purpose: they live in the Supabase dashboard, so this file must
# not carry secrets or claim the providers are off.
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://zexlxabdcsjefptmjhuq.supabase.co/auth/v1/callback"
skip_nonce_check = false
email_optional = true
[auth.external.facebook]
enabled = true
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_SECRET)"
redirect_uri = "https://zexlxabdcsjefptmjhuq.supabase.co/auth/v1/callback"
skip_nonce_check = false
email_optional = true
# Wallet logins are not a shipped sign-in method; leave disabled to shrink the
# attack surface. Mirror this in the dashboard (Auth -> Sign In / Providers).
[auth.web3.solana]
enabled = false

[auth.web3.ethereum]
enabled = false

# SECURITY TODO (blocker until verified): this single function also serves the
# Stripe / CliQ / Sanad / Resend / Twilio webhooks and the Send-SMS auth hook.
# Those callers do not send a Supabase JWT, so with verify_jwt = true the gateway
# answers 401 before the signature checks in _handlers/webhooks.ts ever run.
# Preferred fix: move the webhook routes into their own function with
# verify_jwt = false (each route verifies its provider signature), and keep this
# function at true. Verify with `stripe trigger checkout.session.completed` and a
# real phone-OTP login against the deployed project.
[functions.make-server-0b1f4071]
verify_jwt = true

[functions.outbox-worker]
verify_jwt = false

# [functions.outbox-worker.cron]
# schedule = "* * * * *"