
# ============================================================
# WASEL - SUPABASE PRODUCTION-ORIENTED CONFIGURATION
# PostgreSQL 17 | React/Vite | Mobile | Edge Functions
# ============================================================

project_id = "wasel"

# ============================================================
# API
# ============================================================

[api]
enabled = true
port = 54321

# Expose only schemas intentionally required by the Data API.
# public and storage are included by Supabase.
schemas = ["public"]

extra_search_path = ["public", "extensions"]

# Keep pagination enabled in application queries.
max_rows = 1000

# ============================================================
# DATABASE
# ============================================================

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

# ============================================================
# REALTIME
# ============================================================

[realtime]
enabled = true

# ============================================================
# STUDIO
# ============================================================

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ============================================================
# EMAIL TESTING
# ============================================================

[local_smtp]
enabled = true
port = 54324

# ============================================================
# STORAGE
# ============================================================

[storage]
enabled = true
file_size_limit = "50MiB"

# S3-compatible API disabled unless an application dependency
# explicitly requires S3 protocol access.
[storage.s3_protocol]
enabled = false

# ============================================================
# AUTHENTICATION
# ============================================================

[auth]
enabled = true

# Canonical production domain.
site_url = "https://www.wasel14.online"

# Explicit redirect allowlist.
# Avoid broad production wildcards.
additional_redirect_urls = [
  "https://www.wasel14.online/app/auth/callback",
  "https://wasel14.online/app/auth/callback",

  "https://www.wasel14.online/api/auth/callback",
  "https://wasel14.online/api/auth/callback",

  "http://localhost:3000/app/auth/callback",
  "http://127.0.0.1:3000/app/auth/callback",

  "http://localhost:5173/app/auth/callback",
  "http://127.0.0.1:5173/app/auth/callback",

  "http://localhost:4173/app/auth/callback",
  "http://127.0.0.1:4173/app/auth/callback",

  "wasel://auth/callback"
]

# JWT lifetime: 1 hour.
jwt_expiry = 3600

# Refresh token security.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Disable manual anonymous account linking unless explicitly required.
enable_manual_linking = false

# Public registration.
enable_signup = true

# Anonymous sessions disabled.
enable_anonymous_sign_ins = false

# Password security.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

# ============================================================
# MULTI-FACTOR AUTHENTICATION
# ============================================================

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# ============================================================
# EMAIL AUTHENTICATION
# ============================================================

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# OTP throttling.
max_frequency = "1m0s"

# Eight-digit verification codes.
otp_length = 8

# OTP expires after 10 minutes.
otp_expiry = 600

# ============================================================
# SMS AUTHENTICATION
# ============================================================

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your code is {{ .Code }}"
max_frequency = "30s"

# SMS hook disabled until a provider is configured.
[auth.hook.send_sms]
enabled = false
uri = "https://zexlxabdcsjefptmjhuq.supabase.co/functions/v1/make-server-0b1f4071/auth/hooks/send-sms"

# ============================================================
# TWILIO SMS
# ============================================================

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = ""

[auth.sms.twilio_verify]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_VERIFY_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# ============================================================
# GOOGLE OAUTH
# ============================================================

[auth.external.google]
enabled = true

# Supply these through the CLI environment.
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_CLIENT_SECRET)"

# Supabase hosted OAuth callback.
# Override for local development using the CLI environment.
redirect_uri = "env(SUPABASE_AUTH_REDIRECT_URI)"

skip_nonce_check = false
email_optional = false

# ============================================================
# FACEBOOK OAUTH
# ============================================================

[auth.external.facebook]
enabled = true

client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_SECRET)"

redirect_uri = "env(SUPABASE_AUTH_REDIRECT_URI)"

skip_nonce_check = false
email_optional = false

# ============================================================
# WEB3 AUTHENTICATION
# ============================================================

[auth.web3.solana]
enabled = false

[auth.web3.ethereum]
enabled = false

# ============================================================
# EDGE FUNCTION SECURITY
# ============================================================

# Main application API.
#
# Gateway JWT verification is disabled because /health must be
# publicly accessible. Every other protected route MUST perform
# independent JWT authentication and authorization.
# Privileged user routes also require Supabase AAL2; webhook routes
# validate their provider signatures.
#
# OPTIONS requests must be handled with proper CORS responses.

[functions.make-server-0b1f4071]
verify_jwt = false

# ============================================================
# STRIPE PAYMENTS
# ============================================================

# Function performs its own JWT authentication.
# Webhook processing belongs to the dedicated webhooks function.

[functions.stripe-payments-v2]
verify_jwt = false

# ============================================================
# WEBHOOKS
# ============================================================

# External providers cannot be expected to send Supabase JWTs.
# Every handler must verify the actual provider signature.
#
# Stripe: Stripe-Signature.
# Other providers: their respective signing mechanisms.
#
# Enforce replay protection and event idempotency.

[functions.webhooks]
verify_jwt = false

# ============================================================
# OUTBOX WORKER
# ============================================================

# Gateway JWT verification enabled.
#
# Internal scheduler must send a valid Supabase JWT.
# Worker must ALSO enforce its internal authorization rules.
# Never expose service-role credentials to browser/mobile clients.

[functions.outbox-worker]
verify_jwt = true

# Stripe Sync setup and teardown are operator-only. The handler verifies the
# service-role bearer key; DELETE also requires a Management API token header.
# Never call this from browser/mobile clients.
[functions.stripe-setup]
verify_jwt = true

# ============================================================
# END OF WASEL CONFIGURATION
# ============================================================
