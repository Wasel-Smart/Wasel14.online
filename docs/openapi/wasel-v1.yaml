components:
  schemas:
    Metadata:
      type: object
      properties:
        requestId:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
      required: []
    ErrorPayload:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
    EnvelopeBase:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
    Trip:
      type: object
      required:
        - trip_id
        - origin_city
        - destination_city
        - departure_time
      properties:
        trip_id:
          type: string
        origin_city:
          type: string
        destination_city:
          type: string
        departure_time:
          type: string
          format: date-time
        available_seats:
          type: integer
        price_per_seat:
          type: number
        trip_status:
          type: string
        allow_packages:
          type: boolean
    Booking:
      type: object
      required:
        - booking_id
        - trip_id
        - passenger_id
      properties:
        booking_id:
          type: string
        trip_id:
          type: string
        passenger_id:
          type: string
        seats_requested:
          type: integer
        booking_status:
          type: string
        amount:
          type: number
    Package:
      type: object
      required:
        - package_id
        - tracking_number
        - sender_id
      properties:
        package_id:
          type: string
        tracking_number:
          type: string
        sender_id:
          type: string
        origin_name:
          type: string
        destination_name:
          type: string
        status:
          type: string
        delivery_fee:
          type: number
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
        service:
          type: string
        runtime:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        ready:
          type: boolean
        checks:
          type: object
        broker:
          type: object
          properties:
            kind:
              type: string
            outboxPending:
              type: integer
            deadLetterCount:
              type: integer
    CreateTripRequest:
      type: object
      required:
        - from
        - to
        - date
        - time
        - seats
        - carModel
      properties:
        from:
          type: string
        to:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        seats:
          type: integer
        carModel:
          type: string
        acceptsPackages:
          type: boolean
        packageCapacity:
          type: string
          enum:
            - none
            - small
            - medium
            - large
        note:
          type: string
    CreateBookingRequest:
      type: object
      required:
        - trip_id
        - seats_requested
      properties:
        trip_id:
          type: string
        seats_requested:
          type: integer
        total_price:
          type: number
        pickup_stop:
          type: string
        dropoff_stop:
          type: string
        status:
          type: string
    CreatePackageRequest:
      type: object
      required:
        - tracking_number
        - sender_id
        - receiver_name
        - receiver_phone
        - origin_name
        - destination_name
        - size
      properties:
        tracking_number:
          type: string
        sender_id:
          type: string
        receiver_name:
          type: string
        receiver_phone:
          type: string
        origin_name:
          type: string
        origin_coords:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        destination_name:
          type: string
        destination_coords:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        size:
          type: string
          enum:
            - small
            - medium
            - large
        weight:
          type: number
        description:
          type: string
        declared_value:
          type: number
        fragile:
          type: boolean
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorPayload'
        metadata:
          $ref: '#/components/schemas/Metadata'
