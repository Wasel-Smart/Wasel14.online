<!DOCTYPE html>

<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Initial locale must run before the application loads -->
    <script src="/initial-locale.js"></script>

    <!-- Theme / application -->
    <title>Wasel</title>
    <meta
      name="description"
      content="Wasel (واصل) — Jordan's bilingual mobility network for shared rides, package delivery, and corridor-first travel across the kingdom. Ride. Share. Move."
    />
    <link rel="canonical" href="https://wasel14.online/" />
    <meta name="theme-color" content="#081D39" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Wasel" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Wasel" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Prevent automatic phone/email/address detection -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, email=no, address=no"
    />

    <!-- App Store -->
    <meta name="apple-itunes-app" content="app-id=com.wasel.smart" />

    <!-- Open Graph / social sharing (static so crawlers that don't run JS still see it) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wasel" />
    <meta property="og:title" content="Wasel | Smart Mobility" />
    <meta
      property="og:description"
      content="Jordan's bilingual mobility network for rides, packages, and corridor-first travel across the kingdom."
    />
    <meta property="og:url" content="https://wasel14.online" />
    <meta property="og:image" content="https://wasel14.online/brand/assets/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_JO" />
    <meta property="og:locale:alternate" content="ar_JO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wasel | Smart Mobility" />
    <meta
      name="twitter:description"
      content="Jordan's bilingual mobility network for rides, packages, and corridor-first travel across the kingdom."
    />
    <meta name="twitter:image" content="https://wasel14.online/brand/assets/og/og-default.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- Apple touch icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- PWA manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- iOS PWA startup images -->
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />

    <!-- Critical third-party connection hints -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://zexlxabdcsjefptmjhuq.supabase.co"
    />

    <!-- Stripe and Google Maps are only needed on specific flows (wallet, maps).
         DNS-prefetch warms the lookup without holding open idle connections
         on every first load, which competes with the critical path on mobile. -->
    <link
      rel="dns-prefetch"
      href="https://api.stripe.com"
    />

    <link
      rel="dns-prefetch"
      href="https://maps.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="https://sentry.io"
    />

    <link
      rel="dns-prefetch"
      href="https://js.stripe.com"
    />

    <!-- Preload Wasel brand asset -->
    <link
      rel="preload"
      as="image"
      href="/brand/assets/logos/symbols/symbol-default.svg"
      fetchpriority="high"
    />

    <!-- Brand fonts (Plus Jakarta Sans for Latin, Cairo/Tajawal for Arabic).
         display=swap keeps text visible during load. Allowed by the CSP in
         vercel.json (style-src fonts.googleapis.com, font-src fonts.gstatic.com).
         TODO: self-host under /public/fonts (see brand/FONTS.md) for offline/PWA. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap"
    />

    <!-- Critical pre-render styles (extracted to avoid Vite 6 html-proxy conflict) -->
    <link rel="stylesheet" href="/src/styles/critical.css" />

  </head>

  <body>
    <div id="root"></div>

    <noscript>
      <div
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#081D39;color:#F8FBFF;font-family:'Plus Jakarta Sans','Cairo','Tajawal',sans-serif;text-align:center"
      >
        <div style="max-width:480px">
          <h1 style="margin:0 0 12px;color:#00E5FF">Wasel | واصل</h1>
          <p style="margin:0 0 8px">Please enable JavaScript to use Wasel.</p>
          <p style="margin:0">يرجى تفعيل جافا سكريبت لاستخدام واصل.</p>
        </div>
      </div>
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Wasel",
        "alternateName": "واصل",
        "url": "https://wasel14.online",
        "logo": "https://wasel14.online/brand/assets/logos/symbols/symbol-default.svg",
        "slogan": "Ride. Share. Move.",
        "areaServed": "JO"
      }
    </script>

    <!-- Wasel application entry point -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
