name: DB Drift

# Fails when the production database no longer matches supabase/migrations.
# This is the check that would have caught "local schema differs from
# production" before it blocked a push.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD    the project's database password
#   SUPABASE_PROJECT_REF    the project ref (the xxxx in xxxx.supabase.co)
# Without them the job reports a notice and exits 0 so forks stay green.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/db-drift.yml'

permissions:
  contents: read

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Production schema matches migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check credentials are available
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Skipping drift check: SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF are not all set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        if: steps.creds.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"

      # Gate 1: migration history. Fails if production has applied versions that
      # are missing from the repo (or the repo is out of order), which is exactly
      # what makes `supabase db push` refuse to run.
      - name: Migration history is consistent (dry run)
        if: steps.creds.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      # Gate 2: actual schema. The diff of production against the schema the
      # migrations produce must be empty.
      - name: Schema diff must be empty
        if: steps.creds.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db diff --linked --schema public > drift.sql
          if [ -s drift.sql ]; then
            echo "::error::Production schema has drifted from supabase/migrations. Diff below."
            cat drift.sql
            exit 1
          fi
          echo "No schema drift."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: schema-drift
          path: drift.sql
          if-no-files-found: ignore
          retention-days: 14
