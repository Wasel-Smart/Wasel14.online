name: Deploy

on:
  push:
    branches: [main, master]
  # Preview deployments for every pull request (was missing, so the preview job
  # below could never run).
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Quality gate (shared by every deploy path) ───────────────────────────────
  # Deploys must not depend on a *separate* workflow having passed, because
  # GitHub runs workflows in parallel. The gate is repeated here so a red
  # build can never reach production.
  verify:
    name: Verify (types, lint, unit, edge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Same flag as ci.yml so both workflows resolve dependencies identically.
      # Drop --legacy-peer-deps everywhere once `npm install` has been run after
      # the @eslint/js bump and `npm ci` passes without it.
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:ci
      - run: npm run build

  # ── Preview (pull requests) ──────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./

  # ── Backend: migrations first, then edge functions ───────────────────────────
  # Runs before the frontend so a new client never ships against an old API.
  # Gated by the GitHub `production` environment, so required reviewers apply.
  deploy-backend:
    name: Deploy Backend (migrations + edge functions)
    if: github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      PROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: supabase/setup-cli@v1
        with:
          # Keep the hosted deploy on the v2 semantics used by this repo's CLI.
          # v3 database commands target local unless explicitly passed --remote.
          version: 2.122.1
      - run: npm ci --legacy-peer-deps
      - name: Select Supabase environment and check credentials
        id: creds
        run: |
          # Never let a missing staging value fall back to production.
          if [ "$DEPLOY_ENV" = "staging" ]; then
            selected_ref="$STAGING_SUPABASE_PROJECT_REF"
            selected_token="$STAGING_SUPABASE_ACCESS_TOKEN"
            selected_password="$STAGING_SUPABASE_DB_PASSWORD"
          else
            selected_ref="zexlxabdcsjefptmjhuq"
            selected_token="$PROD_SUPABASE_ACCESS_TOKEN"
            selected_password="$PROD_SUPABASE_DB_PASSWORD"
          fi
          if [ -z "$selected_token" ] || [ -z "$selected_password" ] || [ -z "$selected_ref" ]; then
            echo "::error::Supabase credentials or project ref are not set for the selected environment. Refusing to deploy the frontend without deploying the backend."
            exit 1
          fi
          {
            echo "SUPABASE_PROJECT_REF=$selected_ref"
            echo "SUPABASE_ACCESS_TOKEN=$selected_token"
            echo "SUPABASE_DB_PASSWORD=$selected_password"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Preview database migrations
        if: steps.creds.outputs.ready == 'true'
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Prepare edge function bundles
        if: steps.creds.outputs.ready == 'true'
        run: npm run edge:sync && npm run edge:graph && npm run edge:types
      - name: Deploy main edge function
        if: steps.creds.outputs.ready == 'true'
        run: supabase functions deploy make-server-0b1f4071 --project-ref "$SUPABASE_PROJECT_REF"
      - name: Retire legacy Stripe payment function
        if: steps.creds.outputs.ready == 'true'
        run: supabase functions deploy stripe-payments-v2 --project-ref "$SUPABASE_PROJECT_REF"

  # ── Frontend (Vercel) ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    if: github.event_name != 'pull_request'
    needs: [verify, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      # Vercel builds the app itself from source with the project's environment
      # variables, so no local build is needed here (verify already proved it).
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # staging => preview deployment; push to main or explicit production => --prod
          vercel-args: ${{ (github.event_name == 'push' || inputs.environment == 'production') && '--prod' || '' }}
          working-directory: ./

  # ── Smoke tests after deploy ─────────────────────────────────────────────────
  smoke-tests:
    name: Post-Deploy Smoke Tests
    if: github.event_name != 'pull_request'
    needs: [deploy-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      # k6 is not preinstalled on GitHub runners; `npm run test:load:smoke`
      # shells out to it and failed with "command not found".
      - uses: grafana/setup-k6-action@v1
      - name: Run smoke test
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            BASE_URL="$STAGING_URL"
          else
            BASE_URL="$PRODUCTION_URL"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::The URL for the selected deployment environment is not set - post-deploy smoke test cannot run."
            exit 1
          fi
          export BASE_URL
          npm run test:load:smoke
