name: Secret Scanning

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # `--only-verified` hides anything the provider API can't confirm live
          # (plain DB passwords, revoked-but-reusable keys, custom tokens). Report
          # unverified hits too; use .trufflehog-ignore for reviewed false positives.
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-ignore

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
