name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check

  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run secrets:check
      - run: npm run env:check

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Catches missing imports/exports (the failure mode of a half-finished
      # handler split) before deploy, since a link error stops the function booting.
      - name: Type-check main API function
        run: deno check supabase/functions/make-server-0b1f4071/index.ts

  oauth-check:
    name: OAuth Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:oauth

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit -- --run --coverage
      - name: Enforce coverage thresholds
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const fail = [];
            if (t.branches.pct < 75)  fail.push('branches ' + t.branches.pct + '% < 75%');
            if (t.functions.pct < 80) fail.push('functions ' + t.functions.pct + '% < 80%');
            if (t.lines.pct < 85)     fail.push('lines ' + t.lines.pct + '% < 85%');
            if (fail.length) { console.error('Coverage gate failed:', fail.join(', ')); process.exit(1); }
            console.log('Coverage gate passed');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, oauth-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          VITE_E2E_LOCAL_AUTH: 'true'
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-results
          path: test-results/
          retention-days: 7

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
