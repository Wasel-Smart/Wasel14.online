name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: CI only needs to read the repository. Individual jobs that
# need more (none today) must declare it themselves.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check

  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run secrets:check
      - run: npm run env:check

  edge-functions:
    name: Edge Functions (bundle + deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --legacy-peer-deps
      # `supabase functions deploy` uploads one directory at a time, so a
      # relative import that escapes that directory cannot be resolved at
      # runtime: Deno fails the whole module graph at link time and every route
      # answers 503 BOOT_ERROR while the function still reports ACTIVE. The
      # sync:check step proves the vendored copies match their sources, the graph
      # step proves nothing escapes or dangles, and the type check proves every
      # named import resolves and every handler is wired.
      - name: Bundles are self-contained and in sync
        run: npm run edge:sync:check
      - name: Module graph is closed
        run: npm run edge:graph
      - name: Type-check every edge function
        run: npm run edge:types

  oauth-check:
    name: OAuth Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # No .env exists in CI by design. The script skips variable-presence checks
      # when CI=true and still verifies config.toml, auth files and the OAuth
      # implementation.
      - run: npm run verify:oauth

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit -- --run --coverage
      - name: Enforce coverage thresholds
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const fail = [];
            if (t.branches.pct < 75)  fail.push('branches ' + t.branches.pct + '% < 75%');
            if (t.functions.pct < 80) fail.push('functions ' + t.functions.pct + '% < 80%');
            if (t.lines.pct < 85)     fail.push('lines ' + t.lines.pct + '% < 85%');
            if (fail.length) { console.error('Coverage gate failed:', fail.join(', ')); process.exit(1); }
            console.log('Coverage gate passed');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  route-contract:
    name: Route Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      # Reports frontend paths the edge function declares no route for. These
      # are silent 404s at runtime that no type or unit test can see. This is a
      # hard gate: /active-trip, /notifications* and /reviews are implemented, so
      # a new frontend call without a matching route must fail CI.
      - name: Frontend paths must exist on the backend
        run: npm run check:routes

  backend-wiring:
    name: Backend Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Probes the live deployment, so it only does real work where credentials
    # exist. The `secrets` context is NOT available in a job-level `if` (using it
    # there makes GitHub reject the whole workflow file), so the check lives in a
    # step and reads the secrets through env instead.
    # Without this, a function whose service-role key is invalid still passes
    # lint, typecheck, deno check and the unit suite: /health returns 200 while
    # every route that reads the database 500s.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Verify frontend can reach the backend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EDGE_FUNCTIONS_BASE_URL: ${{ secrets.VITE_EDGE_FUNCTIONS_BASE_URL }}
          VITE_EDGE_FUNCTION_NAME: ${{ vars.VITE_EDGE_FUNCTION_NAME || 'make-server-0b1f4071' }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::notice::Skipping backend wiring probe: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set."
            exit 0
          fi
          node scripts/verify-frontend-backend-wiring.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, oauth-check, edge-functions, route-contract, secrets-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          VITE_E2E_LOCAL_AUTH: 'true'
          VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-results
          path: test-results/
          retention-days: 7

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
