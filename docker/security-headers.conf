# Security headers shared by every location block.
#
# nginx only inherits `add_header` from the parent when a location defines NONE of its own.
# The previous config set Cache-Control inside the .html / sw.js / boot-script locations, which
# silently dropped CSP, HSTS and X-Frame-Options from exactly those responses (including the SPA
# shell, since try_files falls back to /index.html and re-enters the .html location).
# Keep this CSP in step with vercel.json, which is the production source of truth.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zexlxabdcsjefptmjhuq.supabase.co https://images.unsplash.com https://api.qrserver.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://zexlxabdcsjefptmjhuq.supabase.co wss://zexlxabdcsjefptmjhuq.supabase.co https://www.wasel14.online https://wasel14.online wss://*.sentry.io https://api.stripe.com https://maps.googleapis.com https://*.sentry.io https://vitals.vercel-insights.com https://*.in.applicationinsights.azure.com https://dc.services.visualstudio.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://zexlxabdcsjefptmjhuq.supabase.co; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
# Matches vercel.json. `same-origin` + COEP `require-corp` (the previous values) break the OAuth
# popup, the Stripe iframe and every cross-origin image/font, so they are intentionally not set.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
