server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  # SPA shell and anything without a more specific rule (manifest, txt, xml).
  location / {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # Service worker must never be cached by the browser or a CDN.
  # Mobile browsers (especially Safari/WebKit) will otherwise keep
  # serving the old sw.js byte-for-byte and never detect the update,
  # which is the root cause of app_mount_timeout after a deploy.
  location = /sw.js {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # These non-hashed scripts run before the app bundle. Do not cache them as
  # immutable: they carry the recovery UI and must follow each release.
  location ~ ^/(initial-locale|boot-status)\.js$ {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Vite emits content-hashed filenames under /assets/, so these can be cached forever.
  location ^~ /assets/ {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /fonts/ {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else static (logos, icons, favicons) keeps a stable filename, so it must NOT be
  # immutable: a replaced logo would otherwise stay stale in browsers for a year.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  location /health {
    include /etc/nginx/snippets/wasel-security-headers.conf;
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
